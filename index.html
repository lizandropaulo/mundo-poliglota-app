<style>

.urow{border-top:1px solid #eef1f6;padding:8px 0}.row2{display:flex;gap:6px;align-items:center;margin-top:6px}.row2 select{margin:0}
#call{position:fixed;inset:0;background:#0B1624;z-index:20;display:flex;flex-direction:column}#pres{max-height:45vh;background:#000;display:flex;justify-content:center}#pres:empty{display:none}#pres img,#pres video,#pres iframe{max-height:45vh;max-width:100%;width:100%;border:0}
.vg{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;padding:6px;overflow:auto;align-content:start}.vg video{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#16263a}
.cc{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 10px calc(14px + env(safe-area-inset-bottom))}.cc .ib{width:auto;padding:0 14px;height:42px;font-size:13px;font-weight:600}.cc .ib.off{background:var(--bad);color:#fff}.cc .end{background:var(--bad);color:#fff}
#pp{display:flex;gap:6px;align-items:center;padding:6px 10px;flex-wrap:wrap}#pp select{flex:1;margin:0;min-width:160px}

<script>
// ===== Configuração (a chave "publishable" é pública por desenho) =====
const U='https://qncopukzrpttlggqfbee.supabase.co',K='sb_publishable_qsakfkmlO9ObZR6iPyB84w_-50l31wC';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),shuf=a=>[...a].sort(()=>Math.random()-.5),norm=s=>String(s).trim().split(/\s+/).join(' ').toLowerCase();
let tok=null,uid=null,me=null,V='courses',sub=null,AUTH='in',LS=[],D=1,G=null,tm=null;
const toast=t=>{const e=$('#toast');e.textContent=t;e.className='on';setTimeout(()=>e.className='',Math.max(2500,t.length*60))};
async function rq(path,o={}){const h={apikey:K,...(o.h||{})};if(tok)h.Authorization='Bearer '+tok;let b=o.body;
 if(b&&!(b instanceof Blob)){h['Content-Type']='application/json';b=JSON.stringify(b)}
 const r=await fetch(U+path,{method:o.m||'GET',headers:h,body:b}),t=await r.text();
 if(!r.ok){let m=t;try{const j=JSON.parse(t);m=j.msg||j.message||j.error_description||j.error||t}catch{}throw new Error(m)}
 try{return t?JSON.parse(t):null}catch{return null}}
const get=q=>rq('/rest/v1/'+q),post=(t,b)=>rq('/rest/v1/'+t,{m:'POST',body:b,h:{Prefer:'return=minimal'}}),patch=(q,b)=>rq('/rest/v1/'+q,{m:'PATCH',body:b,h:{Prefer:'return=minimal'}}),del=q=>rq('/rest/v1/'+q,{m:'DELETE'});
async function up(bucket,path,f){await rq(`/storage/v1/object/${bucket}/${path}`,{m:'POST',body:f,h:{'x-upsert':'true','Content-Type':f.type||'application/octet-stream'}});return `${U}/storage/v1/object/public/${bucket}/${path}`}
// ===== Sessão =====
function sess(j){tok=j.access_token;uid=j.user.id;localStorage.rt=j.refresh_token}
const loadMe=async()=>{me=(await get(`profiles?id=eq.${uid}&select=*`))[0];if(me.role=='admin')me.languages=LNG.map(l=>l[0]);if(me.languages&&me.languages.length&&!me.languages.includes(LANG)){LANG=me.languages[0];localStorage.lang=LANG}try{ENR=await get(`enrollments?user_id=eq.${uid}&select=*`)}catch{ENR=[]}};
async function resume(){const r=localStorage.rt;if(!r)return false;try{sess(await rq('/auth/v1/token?grant_type=refresh_token',{m:'POST',body:{refresh_token:r}}));await loadMe();return true}catch{return false}}
setInterval(()=>{if(tok&&localStorage.rt)rq('/auth/v1/token?grant_type=refresh_token',{m:'POST',body:{refresh_token:localStorage.rt}}).then(sess).catch(()=>{})},50*60*1000);
async function auth(){try{const e=$('#le').value.trim(),p=$('#lp').value;
 if(AUTH=='up'){const n=$('#ln').value.trim();if(!n)throw new Error('Indica o teu nome.');const j=await rq('/auth/v1/signup',{m:'POST',body:{email:e,password:p,data:{full_name:n}}});if(!j.access_token)throw new Error('Conta criada. Confirma o teu e-mail e depois entra.');sess(j)}
 else{if(!e||!p)throw new Error('Indica o e-mail e a palavra-passe.');sess(await rq('/auth/v1/token?grant_type=password',{m:'POST',body:{email:e,password:p}}))}
 await loadMe();V='courses';render()}catch(x){toast(x.message)}}
const logout=()=>{localStorage.removeItem('rt');tok=uid=me=null;sub=null;render()};
const dl=()=>JSON.parse(localStorage.dl||'[]');
function offl(){me={role:'student',xp:0,full_name:''};uid='';V='courses';render()}
// ===== Estrutura =====
const P={book:'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5',game:'M7 6h10a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4h-1l-2-2h-4l-2 2H7a4 4 0 0 1-4-4v-4a4 4 0 0 1 4-4zM8 10v4M6 12h4',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',chat:'M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z',cal:'M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2zM3 10h18M8 2v4M16 2v4',shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z'};
const ic=n=>`<svg width=22 height=22 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=1.9 stroke-linecap=round stroke-linejoin=round><path d="${P[n]}"/></svg>`;
function render(){const a=$('#app');
 if(!me){a.innerHTML=`<div class=lg><img src=icon-512.png><h2 style=color:#fff>Bem-vindo</h2><p class=s>A tua escola de idiomas no bolso</p>${AUTH=='up'?'<input id=ln placeholder=Nome>':''}<input id=le type=email placeholder=E-mail autocapitalize=off><input id=lp type=password placeholder=Palavra-passe><button class="btn y" onclick="auth()">${AUTH=='up'?'Criar conta':'Entrar'}</button><p class=lnk onclick="AUTH=AUTH=='up'?'in':'up';render()">${AUTH=='up'?'Já tenho conta':'Ainda não tens conta? Cria uma'}</p>${dl().length?'<p class=lnk onclick="offl()">Ver downloads (sem internet)</p>':''}</div>`;return}
 if(needLang()){a.innerHTML=vLangs();return}
 const nav=[['courses','Cursos','book'],['games','Jogos','game'],['chat','Chat','chat'],['classes','Aulas','cal'],['me','Perfil','user'],...(me.role=='admin'?[['admin','Admin','shield']]:[])];
 a.innerHTML=`<header><img src=icon-180.png><b>Mundo Poliglota</b>${langSel()}<span>⭐ ${me.xp}</span></header><main id=m></main><nav>${nav.map(n=>`<button class="${V==n[0]&&!sub?'on':''}" onclick="go('${n[0]}')">${ic(n[2])}${n[1]}</button>`).join('')}</nav>`;draw()}
async function draw(){const m=$('#m');if(!m)return;const f=sub||({courses:vCourses,games:vGames,chat:vChat,classes:vClasses,me:vMe,admin:vAdmin})[V];try{m.innerHTML=await f()}catch(e){m.innerHTML=`<div class="card mu">${esc(e.message)}</div>`}}
function stop(){if(G){G.over=true;G=null}clearInterval(tm);clearInterval(CHT)}
const go=v=>{stop();sub=null;V=v;render()},back=()=>{stop();sub=null;render()};
async function addXp(n){if(!uid||n<=0)return;me.xp+=n;await patch(`profiles?id=eq.${uid}`,{xp:me.xp});const s=document.querySelector('header span');if(s)s.textContent='⭐ '+me.xp}
// ===== Cursos e aulas =====
async function vCourses(){try{if(!tok)throw 0;const [cs,ls,pg]=await Promise.all([get('courses?select=*&order=created_at'),get('lessons?select=*&order=position,created_at'),get(`progress?user_id=eq.${uid}&select=lesson_id`)]);LS=ls;const done=new Set(pg.map(p=>p.lesson_id)),off=new Set(dl().map(x=>x.id));
 const cs2=cs.filter(c=>(c.lang||'en')==LANG);return cs2.length?cs2.map(c=>`<div class=card><h3>${esc(c.title)} <span class=tag>${esc(c.level)}</span></h3>${c.description?`<p class=mu>${esc(c.description)}</p>`:''}${ls.filter(l=>l.course_id==c.id).map(l=>`<div class=ls onclick="lesson('${l.id}')"><span class="dot ${done.has(l.id)?'ok':''}">${done.has(l.id)?'✓':'▶'}</span><b>${esc(l.title)}</b>${off.has(l.id)?'<small>offline</small>':''}</div>`).join('')||'<p class=mu>Sem aulas ainda.</p>'}</div>`).join(''):'<div class="card mu">Ainda não há cursos publicados.</div>'}
 catch{const d=dl();return '<div class="card mu">Sem ligação. A mostrar as aulas descarregadas.</div>'+(d.length?d.map(l=>`<div class="card ls" onclick="lesson('${l.id}')"><b>${esc(l.title)}</b></div>`).join(''):'<div class="card mu">Nada descarregado.</div>')}}
async function cget(u){try{return await (await caches.open('dl')).match(u)}catch{return null}}
function lesson(id){const l=LS.find(x=>x.id==id)||dl().find(x=>x.id==id);if(!l)return;
 sub=async()=>{let src=l.source,off=false;if(l.kind!='youtube'){const r=await cget(l.source);if(r){src=URL.createObjectURL(await r.blob());off=true}}
 const media=l.kind=='youtube'?`<div class=vid><iframe src="https://www.youtube.com/embed/${esc(l.source)}?playsinline=1&rel=0&origin=${encodeURIComponent(location.origin)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`:l.kind=='video'?`<video controls playsinline src="${esc(src)}"></video>`:l.kind=='image'?`<img class=full src="${esc(src)}">`:`<a class=btn target=_blank href="${esc(src)}">Abrir ficheiro</a>`;
 return `<button class=ib onclick="back()">←</button><h2>${esc(l.title)}</h2>${media}${l.kind!='youtube'?`<button class="btn o" onclick="toggleDl('${l.id}')">${off?'Remover download':'Descarregar para ver offline'}</button>`:`<a class="btn o" target=_blank href="https://www.youtube.com/watch?v=${esc(l.source)}">Abrir no YouTube</a>`}${uid?`<button class="btn y" onclick="doneL('${l.id}')">Marcar como concluída</button>`:''}`};draw()}
async function toggleDl(id){const l=LS.find(x=>x.id==id)||dl().find(x=>x.id==id);try{const c=await caches.open('dl');
 if(await c.match(l.source)){await c.delete(l.source);localStorage.dl=JSON.stringify(dl().filter(x=>x.id!=id));toast('Download removido')}
 else{toast('A descarregar…');const r=await fetch(l.source);if(!r.ok)throw new Error('Falha no download');await c.put(l.source,r);localStorage.dl=JSON.stringify([...dl().filter(x=>x.id!=id),{id:l.id,title:l.title,kind:l.kind,source:l.source}]);toast('Disponível offline')}}catch(e){toast(e.message)}lesson(id)}
async function doneL(id){try{const h=await get(`progress?user_id=eq.${uid}&lesson_id=eq.${id}&select=lesson_id`);if(!h.length){await post('progress',{user_id:uid,lesson_id:id});await addXp(20);toast('Aula concluída! +20 XP')}back()}catch(e){toast(e.message)}}
// ===== Jogos =====
const GM=[['vocab','Vocabulário','Escolhe a palavra certa'],['grammar','Gramática','Completa a frase'],['listening','Ouve e escolhe','Compreensão oral'],['translate','Tradução','Escolhe a tradução'],['spelling','Soletra','Escreve a palavra em inglês'],['order','Constrói a frase','Ordena as palavras'],['memory','Pares','Memória de vocabulário'],['speed','Contra-relógio','Todas as matérias contra o tempo']];
const vGames=()=>`<div class=card><label class=mu>Dificuldade</label><select onchange="D=+this.value">${['Fácil','Médio','Difícil'].map((x,i)=>`<option value=${i+1} ${D==i+1?'selected':''}>${x}</option>`).join('')}</select><p class=mu>Difícil = menos tempo, menos vidas e mais pontos.</p></div>`+GM.map(g=>`<div class="card gm" onclick="play('${g[0]}')"><b>${g[1]}</b><br><span class=mu>${g[2]}</span></div>`).join('');
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang=lvoice(LANG);speechSynthesis.cancel();speechSynthesis.speak(u)}catch{}}
async function play(game){let all;try{all=(await get('questions?select=*')).filter(q=>(q.lang||'en')==LANG)}catch{return toast('Precisas de internet para jogar.')}
 if(game=='memory')return memory(all.filter(q=>q.game=='vocab'));
 const pool=all.filter(q=>(game=='speed'?q.game!='memory':q.game==game)&&(['spelling','order'].includes(q.game)||(q.options||[]).length>=2));let lv=pool.filter(q=>q.difficulty==D);if(lv.length<4)lv=pool.filter(q=>q.difficulty<=D);
 const qs=shuf(lv).slice(0,game=='speed'?200:8+D*2);if(!qs.length)return toast('Ainda não há perguntas neste jogo. O professor vai adicioná-las.');
 stop();G={game,qs,i:0,score:0,right:0,lives:[5,3,2][D-1],tl:game=='speed'?[60,45,30][D-1]:0,lock:0};
 sub=()=>'<button class=ib onclick="back()">←</button><div class=card style="margin-top:10px"><div class=hud id=hud></div><h3 id=ql></h3><div id=ar></div></div>';await draw();tm=setInterval(tick,1000);show()}
function hud(){const h=$('#hud');if(h&&G)h.textContent=`Vidas: ${G.lives}  ·  Pontos: ${G.score}  ·  ${Math.max(G.tl,0)}s  ·  ${Math.min(G.i+1,G.qs.length)}/${G.game=='speed'?'∞':G.qs.length}`}
function tick(){if(!G||G.over){clearInterval(tm);return}if(G.lock&&G.game!='speed')return;G.tl--;hud();if(G.tl<=0)G.game=='speed'?end():res(false)}
function show(){if(!G||G.over)return;G.lock=0;if(G.i>=G.qs.length)return end();const q=G.qs[G.i];if(G.game!='speed')G.tl=[20,14,8][D-1];hud();
 $('#ql').textContent=q.game=='listening'?'Ouve e escolhe o que ouviste':q.game=='spelling'?'Escreve em '+lname(LANG).toLowerCase()+': '+q.prompt:q.game=='order'?'Ordena a frase: '+q.prompt:q.prompt;const a=$('#ar');
 if(q.game=='spelling')a.innerHTML=`<button class="btn o" onclick="say(G.qs[G.i].answer)">Ouvir</button><input id=sp placeholder=Resposta autocapitalize=off autocomplete=off><button class="btn y" onclick="res(norm($('#sp').value)==norm(G.qs[G.i].answer))">Verificar</button>`;
 else if(q.game=='order'){G.got=[];a.innerHTML=`<div id=got class=ans></div><div>${shuf(q.answer.trim().split(/\s+/)).map(x=>`<button class=wc data-w="${esc(x)}" onclick="pickW(this)">${esc(x)}</button>`).join('')}</div><button class="btn y" onclick="res(norm(G.got.join(' '))==norm(G.qs[G.i].answer))">Verificar</button>`}
 else{if(q.game=='listening')say(q.prompt);a.innerHTML=(q.game=='listening'?'<button class="btn o" onclick="say(G.qs[G.i].prompt)">Ouvir</button>':'')+shuf(q.options||[]).map(o=>`<button class=opt data-o="${esc(o)}" onclick="res(norm(this.dataset.o)==norm(G.qs[G.i].answer),this)">${esc(o)}</button>`).join('')}}

async function res(ok,b){if(!G||G.lock||G.over)return;G.lock=1;const q=G.qs[G.i];if(ok){G.right++;G.score+=10*D+(G.game=='speed'?5:Math.max(G.tl,0)>>1)}else G.lives--;

function memory(vq){const qs=shuf(vq).slice(0,[4,6,8][D-1]);if(qs.length<2)return toast('São precisas pelo menos 2 perguntas de Vocabulário.');

 sub=()=>`<button class=ib onclick="back()">←</button><p id=mh class=mu></p><div class=mg>${cards.map((c,i)=>`<button class=mc data-i="${i}">?</button>`).join('')}</div>`;
 draw().then(()=>{const h=()=>{$('#mh').textContent=`Jogadas: ${moves}   Pares: ${found}/${qs.length}`};h();
 document.querySelectorAll('.mc').forEach(b=>b.onclick=async()=>{if(busy||b===first||b.classList.contains('done'))return;const c=cards[+b.dataset.i];b.textContent=c[1];b.classList.add('up');if(!first){first=b;return}
 moves++;const f=first;first=null;
 if(cards[+f.dataset.i][0]==c[0]){f.classList.replace('up','done');b.classList.replace('up','done');found++;h();if(found==qs.length){const pts=Math.max(20,qs.length*40-moves*4)*D;try{await post('scores',{user_id:uid,game:'memory',difficulty:D,points:pts});await addXp(Math.floor(pts/5))}catch{}toast(`Parabéns! ${pts} pontos`);back()}return}
 busy=true;h();await new Promise(r=>setTimeout(r,800));[f,b].forEach(x=>{x.textContent='?';x.classList.remove('up')});busy=false})})}

const vidId=s=>(s.match(/(?:youtu\.be\/|youtube\.com\/(?:shorts\/|embed\/|live\/|v\/)|[?&]v=)([A-Za-z0-9_-]{11})/)||[])[1];
async function yt(u){const r=await fetch(u),j=await r.json();if(!r.ok)throw new Error('YouTube: '+(j.error&&j.error.message||r.status));return j}
async function vtitle(id,key){try{const j=await (await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id))).json();if(j.title)return j.title}catch{}
 if(key){const j=await yt(`https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${id}&key=${key}`);if(j.items&&j.items.length)return j.items[0].snippet.title}return 'Vídeo '+id}
async function uploads(it,key){const m=it.match(/channel\/(UC[\w-]{22})/);if(m)return 'UU'+m[1].slice(2);if(!key)throw new Error('Para @canal precisas da chave da API do YouTube.');const h=it.match(/@([\w.-]+)/);if(!h)throw new Error('Não reconheci o canal.');const j=await yt(`https://www.googleapis.com/youtube/v3/channels?part=contentDetails&forHandle=@${h[1]}&key=${key}`);if(!j.items||!j.items.length)throw new Error('Canal não encontrado.');return j.items[0].contentDetails.relatedPlaylists.uploads}
async function addList(id,key,cid,have,rows){if(!key)throw new Error('Para playlists e canais precisas da chave da API do YouTube.');let tk='';do{const j=await yt(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${id}&key=${key}${tk?'&pageToken='+tk:''}`);for(const i of j.items){const s=i.snippet,v=s.resourceId.videoId;if(['Private video','Deleted video'].includes(s.title)||have.has(v))continue;have.add(v);rows.push({course_id:cid,title:s.title,kind:'youtube',source:v})}tk=j.nextPageToken||''}while(tk)}
async function imp(){const cid=$('#sc').value;if(!cid)return toast('Cria e escolhe primeiro um curso.');const key=$('#yk').value.trim();if(key)localStorage.ytk=key;const links=$('#yp').value.split(/[\s,;]+/).filter(Boolean);if(!links.length)return toast('Cola pelo menos um link.');
 try{const have=new Set((await get('lessons?select=source&kind=eq.youtube')).map(l=>l.source)),rows=[];
 for(const it of links){const pl=it.match(/[?&]list=([A-Za-z0-9_-]+)/),vid=vidId(it);let list=null;
  if(pl&&!pl[1].startsWith('RD'))list=pl[1];else if(!vid){if(/^UC[\w-]{22}$/.test(it))list='UU'+it.slice(2);else if(/^(PL|UU|OL|FL|LL)[\w-]+$/.test(it))list=it;else if(it.includes('@')||it.includes('/channel/'))list=await uploads(it,key);else throw new Error('Não reconheci este link: '+it)}
  if(list)await addList(list,key,cid,have,rows);else if(!have.has(vid)){have.add(vid);rows.push({course_id:cid,title:await vtitle(vid,key),kind:'youtube',source:vid})}}

 let last=0;try{const r=await get(`signals?room=eq.${room}&select=seq&order=seq.desc&limit=1`);if(r[0])last=r[0].seq}catch{}
 CALL={room,lang,video,st,peers:{},last,mySeq:null,busy:false};

function mkPeer(id){const pc=new RTCPeerConnection(ICE());CALL.peers[id]={pc};CALL.st.getTracks().forEach(t=>pc.addTrack(t,CALL.st));

 pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))dropPeer(id)};return pc}
function dropPeer(id){const p=CALL&&CALL.peers[id];if(p){try{p.pc.close()}catch{}delete CALL.peers[id]}const v=$('#v-'+id);v&&v.remove()}
const gather=pc=>new Promise(r=>{if(pc.iceGatheringState=='complete')return r();const f=()=>{if(pc.iceGatheringState=='complete'){pc.removeEventListener('icegatheringstatechange',f);r()}};pc.addEventListener('icegatheringstatechange',f);setTimeout(r,3000)});
async function offerTo(id){const pc=mkPeer(id);await pc.setLocalDescription(await pc.createOffer());await gather(pc);await sig(id,'offer',pc.localDescription.toJSON())}
async function onSig(s){if(s.from_user==uid){if(s.kind=='hello')CALL.mySeq=s.seq;return}if(s.to_user&&s.to_user!=uid)return;
 if(s.kind=='hello'){if(CALL.mySeq&&s.seq>CALL.mySeq&&!CALL.peers[s.from_user])await offerTo(s.from_user)}
 else if(s.kind=='offer'){dropPeer(s.from_user);const pc=mkPeer(s.from_user);await pc.setRemoteDescription(s.payload);await pc.setLocalDescription(await pc.createAnswer());await gather(pc);await sig(s.from_user,'answer',pc.localDescription.toJSON())}
 else if(s.kind=='answer'){const p=CALL.peers[s.from_user];if(p&&p.pc.signalingState=='have-local-offer')await p.pc.setRemoteDescription(s.payload)}
 else if(s.kind=='bye')dropPeer(s.from_user);else if(s.kind=='present')showPres(s.payload)}
async function pollSig(){if(!CALL||CALL.busy)return;const c=CALL;c.busy=true;try{const r=await get(`signals?room=eq.${c.room}&seq=gt.${c.last}&order=seq.asc`);for(const s of r){c.last=Math.max(c.last,s.seq);if(CALL===c)await onSig(s)}}catch{}c.busy=false}
function cMute(b){CALL.st.getAudioTracks().forEach(t=>t.enabled=!t.enabled);b.classList.toggle('off')}
function cCam(b){CALL.st.getVideoTracks().forEach(t=>t.enabled=!t.enabled);b.classList.toggle('off')}
async function cShare(){try{const d=await navigator.mediaDevices.getDisplayMedia({video:true});const vt=d.getVideoTracks()[0];CALL.scr=d;const swap=t=>Object.values(CALL.peers).forEach(p=>{const s=p.pc.getSenders().find(x=>x.track&&x.track.kind=='video');if(s)s.replaceTrack(t)});swap(vt);$('#vl').srcObject=d;vt.onended=()=>{const cam=CALL&&CALL.st.getVideoTracks()[0];if(cam){swap(cam);$('#vl').srcObject=CALL.st}}}catch{toast('Não foi possível partilhar o ecrã neste dispositivo.')}}
function cPres(){const e=$('#pp');if(e){e.remove();return}const d=document.createElement('div');d.id='pp';d.innerHTML=`<select id=ps>${LS.filter(l=>l.kind!='file').map(l=>`<option value=${l.id}>${esc(l.title)} (${esc(l.kind)})</option>`).join('')}</select><button class="btn y sm" onclick=doPres(1)>Mostrar a todos</button><button class="btn sm" onclick=doPres(0)>Parar</button>`;$('#call').appendChild(d)}
function doPres(on){let p=null;if(on){const l=LS.find(x=>x.id==$('#ps').value);if(!l)return;p={kind:l.kind,url:l.source}}sig(null,'present',p).catch(()=>{});showPres(p)}
function showPres(p){const e=$('#pres');if(!e)return;e.innerHTML=!p?'':p.kind=='youtube'?`<iframe src="https://www.youtube.com/embed/${esc(p.url)}?playsinline=1&rel=0&origin=${encodeURIComponent(location.origin)}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`:p.kind=='video'?`<video controls autoplay playsinline src="${esc(p.url)}"></video>`:`<img src="${esc(p.url)}">`}
async function leaveCall(){if(!CALL)return;const c=CALL;CALL=null;clearInterval(c.t);try{await sig(null,'bye',null,c)}catch{}Object.values(c.peers).forEach(p=>{try{p.pc.close()}catch{}});c.st.getTracks().forEach(t=>t.stop());if(c.scr)c.scr.getTracks().forEach(t=>t.stop());const o=$('#call');o&&o.remove();try{await del(`signals?room=eq.${c.room}&from_user=eq.${uid}&kind=neq.bye`)}catch{}setTimeout(()=>del(`signals?room=eq.${c.room}&from_user=eq.${uid}`).catch(()=>{}),20000)}
addEventListener('beforeunload',()=>{if(CALL)leaveCall()});
// ===== Aulas agendadas =====
async function vClasses(){await refreshEnr();if(!enrolled(LANG))return vEnroll();const from=new Date(Date.now()-3*3600e3).toISOString();
 const [ss,bk]=await Promise.all([get(`sessions?lang=eq.${LANG}&starts_at=gte.${from}&order=starts_at.asc`),get(`session_bookings?user_id=eq.${uid}&select=session_id`)]);const mine=new Set(bk.map(b=>b.session_id)),adm=me.role=='admin';
 return `<h2>Aulas · ${esc(lname(LANG))}</h2>`+(ss.length?ss.map(s=>{const st=new Date(s.starts_at),now=Date.now(),open=adm||(now>=st-15*60000&&now<=st.getTime()+(s.duration_min+30)*60000),isM=mine.has(s.id),full=s.booked>=s.capacity;
 return `<div class=card><b>${esc(s.title)}</b> <span class=tag>${s.kind=='video'?'Vídeo':'Voz'}</span><p class=mu>${esc(st.toLocaleString('pt',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}))} · ${s.duration_min} min · vagas ${s.booked}/${s.capacity}</p>${s.notes?`<p class=mu>${esc(s.notes)}</p>`:''}${isM||adm?`<button class="btn y" ${open?'':'disabled'} onclick="enterSession('${s.id}')">${open?'Entrar na aula':'Disponível 15 min antes'}</button>`:''}${adm?'':(isM?`<button class="btn o" onclick="unbook('${s.id}')">Cancelar reserva</button>`:`<button class=btn ${full?'disabled':''} onclick="book('${s.id}')">${full?'Aula cheia':'Reservar'}</button>`)}</div>`}).join(''):'<div class="card mu">Ainda não há aulas agendadas neste idioma.</div>')}
async function enterSession(id){try{const s=(await get(`sessions?id=eq.${id}&select=*`))[0];joinCall(s.room,s.kind=='video',s.lang)}catch(e){toast(e.message)}}
async function book(id){try{await post('session_bookings',{session_id:id,user_id:uid});toast('Reserva feita.');draw()}catch(e){toast(e.message)}}
async function unbook(id){try{await del(`session_bookings?session_id=eq.${id}&user_id=eq.${uid}`);toast('Reserva cancelada.');draw()}catch(e){toast(e.message)}}
// ===== Administração: gestão =====
async function adminExtra(){const [ss,pe,ib,lg,pr,en,tr]=await Promise.all([get('sessions?select=*&order=starts_at.desc&limit=30'),get('enrollments?status=eq.pending&select=*&order=created_at'),get('ibans?select=*&order=created_at'),get('languages?select=*&order=code'),get('profiles?select=*&order=created_at.desc'),get('enrollments?select=*'),get('settings?key=eq.turn&select=value')]);
 const P2=Object.fromEntries(pr.map(p=>[p.id,p])),act=(u,c)=>en.some(e=>e.user_id==u&&e.lang==c&&e.status=='active'),T=tr[0]?JSON.parse(tr[0].value):{urls:[],username:'',credential:''},lo=LNG.map(l=>`<option value=${l[0]}>${l[1]}</option>`).join(''),alu=new Set(en.filter(e=>e.status=='active').map(e=>e.user_id)).size;
 return `<h2>Gestão</h2>
<div class=card><h3>7. Agendar aula por chamada</h3><select id=sl>${lo}</select><input id=stt placeholder="Título da aula"><input id=sd type=datetime-local><select id=sk><option value=video>Videochamada</option><option value=voice>Chamada de voz</option></select><input id=sm type=number min=1 placeholder="Vagas (1 = individual)" value=1><input id=sdu type=number min=10 placeholder="Duração (min)" value=45><input id=sn placeholder="Notas (opcional)"><button class="btn y" onclick="newSession()">Agendar</button>${ss.map(s=>`<div class=ls><b>${esc(s.title)}</b><small>${esc(lname(s.lang))} · ${esc(new Date(s.starts_at).toLocaleString('pt',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))} · ${s.booked}/${s.capacity}</small><button class=x onclick="delSession('${s.id}')">&#10005;</button></div>`).join('')}</div>
<div class=card><h3>8. Matrículas a validar (${pe.length})</h3>${pe.map(e=>{const u=P2[e.user_id]||{};return `<div class=ls style="flex-wrap:wrap"><b>${esc(u.full_name)} · ${esc(lname(e.lang))}</b><small>${esc(u.email||'')}</small><button class="btn sm o" onclick="proof('${esc(e.proof_path)}')">Comprovativo</button><button class="btn sm y" onclick="decide('${e.id}','active')">Aprovar</button><button class="btn sm" onclick="decide('${e.id}','rejected')">Rejeitar</button></div>`}).join('')||'<p class=mu>Nenhuma pendente.</p>'}</div>
<div class=card><h3>9. IBANs e preço da matrícula</h3><input id=ib1 placeholder="Banco"><input id=ib2 placeholder="Titular da conta"><input id=ib3 placeholder="IBAN"><button class="btn y" onclick="addIban()">Adicionar IBAN</button>${ib.map(i=>`<div class=ls style="flex-wrap:wrap"><div style=flex:1><b>${esc(i.bank)}</b> <small>${i.active?'visível':'oculto'}</small><br><small>${esc(i.holder)} · ${esc(i.iban)}</small></div><button class="btn sm o" onclick="togIban('${i.id}',${!i.active})">${i.active?'Ocultar':'Mostrar'}</button><button class=x onclick="delIban('${i.id}')">&#10005;</button></div>`).join('')}<h3 style="margin-top:14px">Preço por idioma</h3>${lg.map(l=>`<div class=ls><b>${esc(l.name)}</b><input id=fee-${l.code} type=number min=0 value=${l.fee} style="width:90px"><input id=cur-${l.code} value="${esc(l.currency)}" style="width:60px"><button class="btn sm y" onclick="saveFee('${l.code}')">Guardar</button></div>`).join('')}</div>
<div class=card><h3>10. Utilizadores (${pr.length}) · ${alu} com matrícula ativa</h3><input id=us placeholder="Pesquisar por nome ou e-mail" oninput=filt()>${pr.map(u=>`<div class=urow data-s="${esc(((u.full_name||'')+' '+(u.email||'')).toLowerCase())}"><div class=ls><b>${esc(u.full_name||'(sem nome)')}</b><small>${u.role=='admin'?'admin · ':''}${u.xp} XP</small></div><small class=mu>${esc(u.email||'')} · desde ${esc(new Date(u.created_at).toLocaleDateString('pt'))}</small><div>${(u.languages||[]).map(c=>`<span class=tag>${esc(lname(c))}${act(u.id,c)?' ✓':''}</span> `).join('')||'<small class=mu>sem idiomas</small>'}</div><div class=row2><select>${lo}</select><button class="btn sm o" onclick="grant('${u.id}',this)">Dar acesso</button></div></div>`).join('')}</div>
<div class=card><h3>11. Servidor TURN (para as chamadas funcionarem em todas as redes)</h3><p class=mu>Opcional, mas recomendado. Ex.: conta gratuita em metered.ca. URLs separados por vírgula.</p><input id=tu placeholder="turn:servidor:443?transport=tcp" value="${esc((T.urls||[]).join(','))}"><input id=tn placeholder="Utilizador" value="${esc(T.username||'')}"><input id=tc placeholder="Credencial" value="${esc(T.credential||'')}"><button class=btn onclick="saveTurn()">Guardar TURN</button></div>`}
const filt=()=>{const q=$('#us').value.toLowerCase();document.querySelectorAll('.urow').forEach(r=>r.style.display=r.dataset.s.includes(q)?'':'none')};
async function newSession(){const t=$('#stt').value.trim(),d=$('#sd').value;if(!t||!d)return toast('Indica o título e a data/hora.');try{await post('sessions',{lang:$('#sl').value,title:t,starts_at:new Date(d).toISOString(),kind:$('#sk').value,capacity:+$('#sm').value||1,duration_min:+$('#sdu').value||45,notes:$('#sn').value.trim()||null});toast('Aula agendada.');draw()}catch(e){toast(e.message)}}
async function delSession(id){if(!confirm('Apagar esta aula agendada?'))return;try{await del(`sessions?id=eq.${id}`);draw()}catch(e){toast(e.message)}}
async function proof(p){try{const j=await rq('/storage/v1/object/sign/proofs/'+p,{m:'POST',body:{expiresIn:300}});window.open(U+'/storage/v1'+j.signedURL,'_blank')}catch(e){toast(e.message)}}
async function decide(id,s){try{await patch(`enrollments?id=eq.${id}`,{status:s,decided_at:new Date().toISOString()});toast(s=='active'?'Matrícula aprovada.':'Matrícula rejeitada.');draw()}catch(e){toast(e.message)}}
async function grant(u,b){try{await rq('/rest/v1/enrollments?on_conflict=user_id,lang',{m:'POST',body:{user_id:u,lang:b.previousElementSibling.value,status:'active',decided_at:new Date().toISOString()},h:{Prefer:'resolution=merge-duplicates,return=minimal'}});toast('Acesso concedido.');draw()}catch(e){toast(e.message)}}
async function addIban(){const b=$('#ib1').value.trim(),h=$('#ib2').value.trim(),i=$('#ib3').value.trim();if(!b||!h||!i)return toast('Preenche banco, titular e IBAN.');try{await post('ibans',{bank:b,holder:h,iban:i});toast('IBAN adicionado.');draw()}catch(e){toast(e.message)}}
async function togIban(id,a){try{await patch(`ibans?id=eq.${id}`,{active:a});draw()}catch(e){toast(e.message)}}
async function delIban(id){if(!confirm('Remover este IBAN?'))return;try{await del(`ibans?id=eq.${id}`);draw()}catch(e){toast(e.message)}}
async function saveFee(c){try{await patch(`languages?code=eq.${c}`,{fee:+$('#fee-'+c).value||0,currency:$('#cur-'+c).value.trim()||'Kz'});toast('Preço guardado.')}catch(e){toast(e.message)}}
async function saveTurn(){const urls=$('#tu').value.split(',').map(x=>x.trim()).filter(Boolean);try{await rq('/rest/v1/settings?on_conflict=key',{m:'POST',body:{key:'turn',value:JSON.stringify({urls,username:$('#tn').value.trim(),credential:$('#tc').value.trim()})},h:{Prefer:'resolution=merge-duplicates,return=minimal'}});toast('TURN guardado.')}catch(e){toast(e.message)}}
// ===== Tempo real (consulta a cada 8 s) e arranque =====
let sgn='';setInterval(async()=>{if(!tok||V!='courses'||sub)return;try{const s=JSON.stringify(await Promise.all([get('lessons?select=id,title,source'),get('courses?select=id,title,description')]));if(sgn&&s!=sgn)draw();sgn=s}catch{}},8000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{$('#app').innerHTML='<div class=lg><img src=icon-512.png></div>';const hp=new URLSearchParams(location.hash.slice(1));if(hp.get('t')){tok=hp.get('t');uid=hp.get('u');history.replaceState(null,'',location.pathname);try{await loadMe()}catch{tok=uid=null}}else await resume();render()})();
</script></body></html>
